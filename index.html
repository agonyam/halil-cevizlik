<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d0c">
  <title>Agonyam Survey Maps</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #f3f4f3; background: #0b0d0c; }
    main { width: min(640px, calc(100% - 40px)); margin: 0 auto; padding: clamp(64px, 14vh, 130px) 0 60px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid #292d2a; }
    .brand { color: #929a94; font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 1.1rem; font-weight: 500; letter-spacing: -.01em; }
    .places { border-bottom: 1px solid #292d2a; }
    a { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px; min-height: 94px; padding: 18px 2px; color: inherit; text-decoration: none; border-bottom: 1px solid #292d2a; }
    a:last-child { border-bottom: 0; }
    a strong { display: block; font-size: 1.35rem; font-weight: 500; letter-spacing: -.025em; }
    a small { display: block; margin-top: 5px; color: #858d87; font-size: .78rem; }
    a span { color: #7f8981; font-size: 1.1rem; transition: color .15s, transform .15s; }
    a:hover span, a:focus-visible span { color: #d2f47b; transform: translateX(3px); }
    a:focus-visible { outline: 1px solid #d2f47b; outline-offset: 5px; }
    footer { margin-top: 18px; color: #646b66; font-size: .72rem; }
    @media (max-width: 480px) {
      main { width: calc(100% - 32px); padding-top: 48px; }
      header { display: block; }
      h1 { margin-top: 8px; }
      a { min-height: 88px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">Agonyam</div>
      <h1>Survey maps</h1>
    </header>
    <section class="places" aria-label="Survey locations">
      <a href="./akcakoyun/"><div><strong>Akçakoyun</strong><small>9,262 m² · 284 images</small></div><span aria-hidden="true">→</span></a>
      <a href="./hidirlar/"><div><strong>Hıdırlar</strong><small>3,725 m² · 73 images</small></div><span aria-hidden="true">→</span></a>
      <a href="./lokman/"><div><strong>Lokman</strong><small>5,901 m² · 215 images</small></div><span aria-hidden="true">→</span></a>
    </section>
    <footer>2D · 3D · Terrain · Water planning</footer>
  </main>
</body>
</html>
