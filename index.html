<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07110c">
  <title>Agonyam Survey Maps</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #eef7ef; background: radial-gradient(circle at 15% 10%, #214530 0, #0a1710 35%, #050a07 80%); }
    main { width: min(1040px, calc(100% - 40px)); margin: 0 auto; padding: 11vh 0 70px; }
    .eyebrow { color: #aadd67; letter-spacing: .18em; font-size: .75rem; font-weight: 800; text-transform: uppercase; }
    h1 { max-width: 680px; margin: 16px 0 12px; font-size: clamp(2.5rem, 8vw, 5.5rem); line-height: .95; letter-spacing: -.06em; }
    .intro { max-width: 620px; color: #adc0b2; font-size: 1.05rem; line-height: 1.6; }
    .places { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; margin-top: 54px; }
    a { position: relative; min-height: 220px; display: flex; flex-direction: column; justify-content: flex-end; padding: 26px; overflow: hidden; color: inherit; text-decoration: none; border: 1px solid #385344; border-radius: 20px; background: linear-gradient(145deg, rgba(35, 69, 48, .92), rgba(10, 23, 16, .96)); transition: transform .18s ease, border-color .18s ease; }
    a::before { content: ''; position: absolute; inset: -40% -15% 35% 40%; border-radius: 50%; background: rgba(172, 224, 94, .12); filter: blur(2px); }
    a:hover { transform: translateY(-4px); border-color: #aadd67; }
    a span { position: relative; color: #aadd67; font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    a strong { position: relative; margin-top: 8px; font-size: 2rem; letter-spacing: -.03em; }
    a small { position: relative; margin-top: 6px; color: #a9b9ad; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Agonyam · Aerial survey</div>
    <h1>Survey maps</h1>
    <p class="intro">Choose a location to open its full 2D and 3D survey, terrain layers, measurements, and water-planning tools.</p>
    <section class="places" aria-label="Survey locations">
      <a href="./akcakoyun/"><span>Survey map</span><strong>Akçakoyun</strong><small>9,262 m² · 284 images</small></a>
      <a href="./hidirlar/"><span>Survey map</span><strong>Hıdırlar</strong><small>3,725 m² · 73 images</small></a>
    </section>
  </main>
</body>
</html>
