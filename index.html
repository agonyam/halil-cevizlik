<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#172a2f">
  <title>Akçakoyun · WebODM 3D Viewer</title>
  <link rel="stylesheet" href="./vendor/potree/build/potree/potree.css">
  <link rel="stylesheet" href="./vendor/potree/libs/jquery-ui/jquery-ui.min.css">
  <link rel="stylesheet" href="./vendor/potree/libs/openlayers3/ol.css">
  <link rel="stylesheet" href="./vendor/potree/libs/spectrum/spectrum.css">
  <link rel="stylesheet" href="./vendor/potree/libs/jstree/themes/mixed/style.css">
  <link rel="stylesheet" href="./viewer.css">
</head>
<body>
  <main class="model-view">
    <div class="potree_container">
      <div id="potree_render_area"></div>
      <div id="potree_sidebar_container"></div>
    </div>

    <section id="map-view" aria-label="2D survey map" hidden>
      <div id="map"></div>
      <nav class="map-quick-layers" aria-label="Survey layers">
        <button type="button" data-map-quick="orthophoto">▧ Orthophoto</button>
        <button type="button" data-map-quick="plant-health">⌁ Plant Health</button>
        <button type="button" data-map-quick="dsm">▥ Surface Model</button>
        <button type="button" data-map-quick="dtm">▤ Terrain Model</button>
      </nav>
      <aside class="map-sidebar">
        <h2>Layers</h2>
        <label><input type="checkbox" data-map-layer="cameras"> Cameras</label>
        <label><input type="checkbox" data-map-layer="plant-health"> Plant Health (VARI)</label>
        <label><input type="checkbox" data-map-layer="orthophoto" checked> Orthophoto</label>
        <label><input type="checkbox" data-map-layer="dtm"> Terrain model (DTM)</label>
        <label><input type="checkbox" data-map-layer="dsm"> Surface model (DSM)</label>
        <label><input type="checkbox" data-map-layer="contours"> 1 m contours</label>
        <label><input type="checkbox" data-map-layer="satellite" checked> Satellite base map</label>
        <label><input type="checkbox" data-map-layer="osm"> Street map</label>
        <section id="elevation-controls" class="elevation-controls" hidden>
          <h2 id="elevation-title">Terrain Model</h2>
          <div class="elevation-histogram-wrap">
            <canvas id="elevation-histogram" width="272" height="104" aria-label="Elevation histogram with adjustable display range"></canvas>
            <div class="elevation-bounds"><span id="elevation-global-min">—</span><span id="elevation-global-max">—</span></div>
          </div>
          <div class="elevation-range-fields">
            <label>Min <input id="elevation-min" type="number" step="0.001"></label>
            <label>Max <input id="elevation-max" type="number" step="0.001"></label>
          </div>
          <label class="elevation-select">Color
            <select id="elevation-color">
              <option value="viridis">Viridis</option>
              <option value="jet">Jet</option>
              <option value="terrain">Terrain</option>
              <option value="earth">Earth</option>
              <option value="pastel">Pastel</option>
            </select>
          </label>
          <label class="elevation-select">Shading
            <select id="elevation-shading">
              <option value="normal">Normal</option>
              <option value="extruded">Extruded</option>
              <option value="none">None</option>
            </select>
          </label>
          <p class="elevation-crs"><strong>CRS</strong> WGS 84 / UTM zone 35N (EPSG:32635)</p>
          <p id="elevation-status" class="elevation-status" aria-live="polite"></p>
        </section>
        <h2>Layer opacity</h2>
        <input id="map-opacity" aria-label="Survey layer opacity" type="range" min="0" max="1" step="0.05" value="1">
        <h2>Measurement</h2>
        <div class="map-tool-grid">
          <button type="button" data-map-tool="distance" title="Measure distance">↗ Distance</button>
          <button type="button" data-map-tool="area" title="Measure area">▱ Area</button>
          <button type="button" data-map-tool="marker" title="Add annotation">● Marker</button>
          <button type="button" data-map-tool="clear" title="Clear measurements">× Clear</button>
        </div>
        <h2>Overlays</h2>
        <label class="map-upload">＋ Temporary GeoJSON<input id="map-geojson" type="file" accept=".json,.geojson,application/geo+json,application/json"></label>
        <h2>Navigation</h2>
        <div class="map-tool-grid">
          <button id="map-fit" type="button">□ Fit</button>
          <button id="map-location" type="button">⌖ Location</button>
          <button id="map-fullscreen" type="button">⛶ Fullscreen</button>
        </div>
      </aside>
      <div id="map-coordinates" aria-live="polite"></div>
      <div class="map-bottom-actions">
        <button id="map-share" type="button">⌯ Share</button>
        <button id="mode-3d" class="mode-switch" type="button">🌐 3D</button>
      </div>
    </section>

    <div class="survey-title" aria-label="Survey title">
      <span>Akçakoyun</span>
      <small>23 August 2026 · WGS 84 / UTM 35N</small>
    </div>

    <div id="loading" class="standby">
      <div class="cover"></div>
      <div class="content"><span class="spinner"></span><p id="loading-text">Loading point cloud…</p></div>
    </div>

    <div class="model-action-buttons">
      <select id="unit-selector" title="Units">
        <option value="metric">Metric</option>
        <option value="imperial">Imperial</option>
        <option value="imperialUS">Imperial (US)</option>
      </select>
      <button id="snapshot" type="button" title="Take snapshot">▣</button>
      <button id="share" type="button" title="Share">⌯ <span>Share</span></button>
      <button id="show-location" type="button" title="Show my location">⌖ <span>Location</span></button>
      <button id="mode-2d" type="button" title="Open 2D map">▰ <span>2D</span></button>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="./vendor/jquery-1.11.2.min.js"></script>
  <script src="./vendor/potree/libs/spectrum/spectrum.js"></script>
  <script src="./vendor/potree/libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="./vendor/potree/libs/three.js/build/three.min.js"></script>
  <script src="./vendor/potree/libs/three.js/extra/lines.js"></script>
  <script src="./vendor/potree/libs/other/BinaryHeap.js"></script>
  <script src="./vendor/potree/libs/tween/tween.min.js"></script>
  <script src="./vendor/potree/libs/d3/d3.js"></script>
  <script src="./vendor/potree/libs/proj4/proj4.js"></script>
  <script src="./vendor/potree/libs/openlayers3/ol.js"></script>
  <script src="./vendor/potree/libs/i18next/i18next.js"></script>
  <script src="./vendor/potree/libs/jstree/jstree.js"></script>
  <script src="./vendor/potree/build/potree/potree.js"></script>
  <script src="./vendor/potree/libs/plasio/js/laslaz.js"></script>
  <script src="./vendor/GLTFLoader.js"></script>
  <script src="./vendor/DRACOLoader.js"></script>
  <script src="./viewer.js"></script>
  <script src="./map.js"></script>
</body>
</html>
